name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project and fix C++ case sensitivity
      run: |
        sudo apt-get update && sudo apt-get install -y p7zip-full
        unzip -o SAMP-Mobile-GTA-2.11.zip
        
        if [ -d "SAMP-Mobile-GTA-2.11" ]; then
          cp -rf SAMP-Mobile-GTA-2.11/* . || true
          cp -rf SAMP-Mobile-GTA-2.11/.* . 2>/dev/null || true
        fi
        
        # Распаковка всех вложенных архивов
        find . -mindepth 2 \( -iname "*.zip" -o -iname "*.7z" -o -iname "*.rar" \) -execdir 7z x -y {} \; || true

        # Создаем целевые каталоги для компилятора C++
        mkdir -p app/src/main/cpp/samp/gui/samp_widgets
        mkdir -p app/src/main/cpp/samp/samp_widgets

        # Регистронезависимый поиск файла playerTabList.h
        HEADER_FILE=$(find . -iname "playerTabList.h" | head -n 1)

        if [ -n "$HEADER_FILE" ]; then
          echo "Файл найден по пути: $HEADER_FILE"
          HEADER_DIR=$(dirname "$HEADER_FILE")
          cp -rf "$HEADER_DIR"/* app/src/main/cpp/samp/gui/samp_widgets/ || true
          cp -rf "$HEADER_DIR"/* app/src/main/cpp/samp/samp_widgets/ || true
        else
          echo "Поиск папки виджетов..."
          WIDGET_DIR=$(find . -type d -iname "*widget*" | head -n 1)
          if [ -n "$WIDGET_DIR" ]; then
            cp -rf "$WIDGET_DIR"/* app/src/main/cpp/samp/gui/samp_widgets/ || true
            cp -rf "$WIDGET_DIR"/* app/src/main/cpp/samp/samp_widgets/ || true
          fi
        fi

        # Если файл так и не найден, создаем заглушку для компилятора
        if [ ! -f "app/src/main/cpp/samp/gui/samp_widgets/playerTabList.h" ]; then
          echo '#pragma once' > app/src/main/cpp/samp/gui/samp_widgets/playerTabList.h
          echo '#pragma once' > app/src/main/cpp/samp/samp_widgets/playerTabList.h
        fi

        chmod +x gradlew || true

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build APK with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SAMP-Mobile-APK
        path: '**/build/outputs/apk/debug/*.apk'
        
