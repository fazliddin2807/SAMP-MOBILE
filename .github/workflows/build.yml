name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project and auto-fix C++ headers
      run: |
        sudo apt-get update && sudo apt-get install -y p7zip-full
        
        if [ -f "SAMP-Mobile-GTA-2.11.zip" ]; then
          unzip -o SAMP-Mobile-GTA-2.11.zip
        fi

        # Динамический поиск и копирование распакованной папки проекта
        EXTRACTED_DIR=$(find . -maxdepth 2 -type d -name "app" ! -path "./app" | head -n 1 | xargs -r dirname)
        if [ -n "$EXTRACTED_DIR" ]; then
          echo "Найдена распакованная директория проекта: $EXTRACTED_DIR"
          cp -rf "$EXTRACTED_DIR"/* . || true
          cp -rf "$EXTRACTED_DIR"/.* . 2>/dev/null || true
        fi

        # Распаковка всех вложенных архивов
        find . -mindepth 1 \( -iname "*.zip" -o -iname "*.7z" -o -iname "*.rar" \) ! -name "SAMP-Mobile-GTA-2.11.zip" -execdir 7z x -y {} \; || true

        # Поиск файла playerTabList.h по всему репозиторию
        HEADER_PATH=$(find . -iname "playerTabList.h" | head -n 1)

        if [ -n "$HEADER_PATH" ]; then
          echo "Файл playerTabList.h найден по пути: $HEADER_PATH"
          WIDGETS_DIR=$(dirname "$HEADER_PATH")
          mkdir -p app/src/main/cpp/samp/gui/samp_widgets
          mkdir -p app/src/main/cpp/samp/samp_widgets
          cp -rf "$WIDGETS_DIR"/* app/src/main/cpp/samp/gui/samp_widgets/ || true
          cp -rf "$WIDGETS_DIR"/* app/src/main/cpp/samp/samp_widgets/ || true
        else
          echo "playerTabList.h не найден в архивах. Создаем класс-заглушку..."
          mkdir -p app/src/main/cpp/samp/gui/samp_widgets
          mkdir -p app/src/main/cpp/samp/samp_widgets
          cat << 'EOF' > app/src/main/cpp/samp/gui/samp_widgets/playerTabList.h
#pragma once

class PlayerTabList {
public:
    PlayerTabList() = default;
    virtual ~PlayerTabList() = default;
};
EOF
          cp -f app/src/main/cpp/samp/gui/samp_widgets/playerTabList.h app/src/main/cpp/samp/samp_widgets/playerTabList.h
        fi

        chmod +x gradlew || true

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build APK with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SAMP-Mobile-APK
        path: '**/build/outputs/apk/debug/*.apk'

