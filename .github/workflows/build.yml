name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip project and auto-fix C++ headers
      run: |
        sudo apt-get update && sudo apt-get install -y p7zip-full
        unzip -o SAMP-Mobile-GTA-2.11.zip
        
        if [ -d "SAMP-Mobile-GTA-2.11" ]; then
          cp -rf SAMP-Mobile-GTA-2.11/* . || true
          cp -rf SAMP-Mobile-GTA-2.11/.* . 2>/dev/null || true
        fi
        
        # Распаковка всех вложенных архивов
        find . -mindepth 2 \( -name "*.zip" -o -name "*.7z" -o -name "*.rar" \) -execdir 7z x -y {} \; || true

        # Поиск файла playerTabList.h в любых директориях
        HEADER_PATH=$(find . -name "playerTabList.h" | head -n 1)

        if [ -n "$HEADER_PATH" ]; then
          echo "Файл найден по пути: $HEADER_PATH"
          WIDGETS_DIR=$(dirname "$HEADER_PATH")
          
          # Создаем целевые каталоги для компилятора C++
          mkdir -p app/src/main/cpp/samp/gui/samp_widgets
          mkdir -p app/src/main/cpp/samp/samp_widgets
          
          # Копируем файлы виджетов во все возможные точки импорта
          cp -rf "$WIDGETS_DIR"/* app/src/main/cpp/samp/gui/samp_widgets/ || true
          cp -rf "$WIDGETS_DIR"/* app/src/main/cpp/samp/samp_widgets/ || true
        else
          echo "Файл не найден напрямую. Поиск альтернативных папок виджетов..."
          ALT_DIR=$(find . -type d -name "*widget*" | head -n 1)
          if [ -n "$ALT_DIR" ]; then
            mkdir -p app/src/main/cpp/samp/gui/samp_widgets
            cp -rf "$ALT_DIR"/* app/src/main/cpp/samp/gui/samp_widgets/ || true
          fi
        fi

        chmod +x gradlew || true

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build APK with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SAMP-Mobile-APK
        path: '**/build/outputs/apk/debug/*.apk'
